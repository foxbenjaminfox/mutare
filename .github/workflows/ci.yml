name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same PR branch (e.g. rapid pushes). Pushes to
# master always run to completion, so every commit there keeps its own status.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Quality gate: format, Credo, and Dialyzer (the `mix check` alias). Runs on a
  # single, stable toolchain — the one the project is developed against — so the
  # formatter / Credo / Dialyzer verdicts match a local `mix check`. Dialyxir is
  # `only: :dev`, so this job stays in the default (dev) MIX_ENV.
  check:
    name: mix check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Elixir / OTP
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # The PLT is keyed by toolchain + deps; rebuilding it is the slow part of
      # Dialyzer, so cache it separately (it survives mix.lock-only churn poorly,
      # hence the restore-keys fallback to warm-start from a near-match).
      - name: Cache Dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: mix check

  # Test matrix. The `~> 1.18` requirement admits every stable Elixir 1.x release
  # from 1.18 onward, so each current release line gets a blocking entry. The
  # matrix also spans OTP 25-28 across compatible pairings. The development tip
  # is informational only (continue-on-error) so upstream churn never reds the
  # run.
  test:
    name: test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Elixir 1.18 — supported Erlang/OTP 25-27 (tested at both ends).
          - { elixir: "1.18", otp: "25" }
          - { elixir: "1.18", otp: "27" }
          # Elixir 1.19 — supported Erlang/OTP 26-28 (tested at both ends).
          - { elixir: "1.19", otp: "26" }
          - { elixir: "1.19", otp: "28" }
          # Elixir 1.20 — current stable release, tested on OTP 28.
          - { elixir: "1.20", otp: "28" }
          # Elixir's development tip (main). Non-blocking: an early-warning signal
          # for upcoming breakage, not a gate.
          - { elixir: "main", otp: "28", allow-failure: true }
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Elixir / OTP
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get --check-locked

      # The project is kept warnings-clean; on released versions a new warning is
      # a failure. On main it may flag an upcoming deprecation — non-blocking.
      - run: mix compile --warnings-as-errors

      - run: mix test
